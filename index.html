<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>簡易記帳</title>

<style>
:root{
  --primary:#2563eb;
  --danger:#dc2626;
  --success:#16a34a;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:5;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:18px 20px;
}

h1{
  font-size:24px;
  margin:0;
}

.subtitle{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.container{
  max-width:1100px;
  margin:24px auto;
  padding:0 20px 40px;
}

.month-bar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:18px;
}

.month-bar button{
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-size:18px;
}

.month-title{
  font-size:20px;
  font-weight:700;
  min-width:140px;
  text-align:center;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}

.summary-label{
  color:var(--muted);
  font-size:14px;
}

.summary-value{
  font-size:27px;
  font-weight:800;
  margin-top:8px;
}

.income{
  color:var(--success);
}

.expense{
  color:var(--danger);
}

.balance{
  color:var(--primary);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.section-title{
  margin:0 0 16px;
  font-size:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  color:var(--muted);
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  font:inherit;
  background:#fff;
}

textarea{
  resize:vertical;
  min-height:68px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

button.primary{
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font-weight:600;
  cursor:pointer;
}

button.secondary{
  background:#fff;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 18px;
  cursor:pointer;
}

.stats-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.stat-row{
  display:grid;
  grid-template-columns:90px 1fr auto;
  gap:10px;
  align-items:center;
  font-size:14px;
}

.bar{
  height:9px;
  background:#eef2f7;
  border-radius:999px;
  overflow:hidden;
}

.bar > div{
  height:100%;
  background:var(--primary);
  border-radius:999px;
}

.records{
  margin-top:20px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:14px;
}

th{
  color:var(--muted);
  font-weight:600;
  background:#fafafa;
}

.badge{
  display:inline-block;
  padding:4px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge.in{
  background:#ecfdf5;
  color:#15803d;
}

.badge.out{
  background:#fef2f2;
  color:#b91c1c;
}

.money-in{
  color:var(--success);
  font-weight:700;
}

.money-out{
  color:var(--danger);
  font-weight:700;
}

.row-actions{
  display:flex;
  gap:7px;
}

.small-btn{
  padding:7px 10px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.small-btn:active{
  transform:scale(.97);
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:30px;
}

.footer-note{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  margin-top:20px;
}

.time-text{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

@media(max-width:760px){

  .container{
    padding:0 12px 30px;
    margin-top:16px;
  }

  .summary{
    grid-template-columns:1fr;
    gap:10px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .summary-value{
    font-size:24px;
  }

  .header-inner{
    padding:14px 16px;
  }

  h1{
    font-size:21px;
  }

}

</style>
</head>

<body>

<header>

  <div class="header-inner">

    <h1>簡易記帳</h1>

    <div class="subtitle">
      輕鬆記錄每一筆收入與支出
    </div>

  </div>

</header>


<main class="container">


  <!-- 月份 -->

  <div class="month-bar">

    <button id="prevMonth">‹</button>

    <div
      class="month-title"
      id="monthTitle">
    </div>

    <button id="nextMonth">›</button>

  </div>



  <!-- 統計 -->

  <section class="summary">

    <div class="card">

      <div class="summary-label">
        本月收入
      </div>

      <div
        class="summary-value income"
        id="incomeTotal">

        $0

      </div>

    </div>


    <div class="card">

      <div class="summary-label">
        本月支出
      </div>

      <div
        class="summary-value expense"
        id="expenseTotal">

        $0

      </div>

    </div>


    <div class="card">

      <div class="summary-label">
        本月餘額
      </div>

      <div
        class="summary-value balance"
        id="balanceTotal">

        $0

      </div>

    </div>

  </section>



  <section class="grid">


    <!-- 新增記帳 -->

    <div class="card">

      <h2
        class="section-title"
        id="formTitle">

        新增記帳

      </h2>


      <form id="recordForm">


        <div class="form-grid">


          <div class="field">

            <label>
              日期
            </label>

            <input
              type="date"
              id="date"
              required>

          </div>


          <div class="field">

            <label>
              類型
            </label>

            <select id="type">

              <option value="expense">
                支出
              </option>

              <option value="income">
                收入
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              項目名稱
            </label>

            <input
              id="item"
              placeholder="例如：午餐"
              required>

          </div>


          <div class="field">

            <label>
              金額
            </label>

            <input
              type="number"
              id="amount"
              min="1"
              step="1"
              placeholder="0"
              required>

          </div>


          <div class="field full">

            <label>
              分類
            </label>

            <select id="category">

              <option>餐飲</option>
              <option>交通</option>
              <option>購物</option>
              <option>生活</option>
              <option>娛樂</option>
              <option>醫療</option>
              <option>薪資</option>
              <option>費用</option>
              <option>其他</option>

            </select>

          </div>


          <div class="field full">

            <label>
              備註（可不填）
            </label>

            <textarea
              id="note"
              placeholder="輸入備註...">
            </textarea>

          </div>


        </div>


        <div class="actions">

          <button
            class="primary"
            type="submit"
            id="submitBtn">

            新增紀錄

          </button>


          <button
            class="secondary"
            type="button"
            id="cancelBtn">

            取消

          </button>

        </div>


      </form>

    </div>



    <!-- 分類統計 -->

    <div class="card">

      <h2 class="section-title">
        本月支出分類
      </h2>

      <div
        class="stats-list"
        id="categoryStats">
      </div>

    </div>


  </section>



  <!-- 記帳紀錄 -->

  <section class="card records">

    <h2 class="section-title">
      記帳紀錄
    </h2>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>日期／時間</th>
            <th>類型</th>
            <th>項目</th>
            <th>分類</th>
            <th>金額</th>
            <th>備註</th>
            <th>操作</th>

          </tr>

        </thead>


        <tbody id="recordsBody">

        </tbody>


      </table>

    </div>


    <div class="footer-note">

      資料儲存在目前瀏覽器中，不會因重新整理而消失。

    </div>


  </section>


</main>



<script>


/* =========================
   基本設定
========================= */

const STORAGE_KEY = 'simple_accounting_records_v1';

let currentMonth = new Date();

currentMonth.setDate(1);

let editingId = null;



/* =========================
   DOM
========================= */

const recordForm = document.getElementById('recordForm');

const dateInput = document.getElementById('date');

const typeInput = document.getElementById('type');

const itemInput = document.getElementById('item');

const amountInput = document.getElementById('amount');

const categoryInput = document.getElementById('category');

const noteInput = document.getElementById('note');

const submitBtn = document.getElementById('submitBtn');

const cancelBtn = document.getElementById('cancelBtn');

const formTitle = document.getElementById('formTitle');

const recordsBody = document.getElementById('recordsBody');



/* =========================
   工具
========================= */

function pad(n){

  return String(n).padStart(2,'0');

}


function getTodayDate(){

  const now = new Date();

  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;

}


function getCurrentTime(){

  const now = new Date();

  return `${pad(now.getHours())}:${pad(now.getMinutes())}`;

}


function monthKey(date=currentMonth){

  return `${date.getFullYear()}-${pad(date.getMonth()+1)}`;

}


function formatMoney(n){

  return new Intl.NumberFormat(

    'zh-TW',

    {

      style:'currency',

      currency:'TWD',

      maximumFractionDigits:0

    }

  ).format(Number(n));

}


function escapeHtml(text){

  return String(text ?? '')

    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}



/* =========================
   資料
========================= */

function getRecords(){

  try{

    const data = JSON.parse(

      localStorage.getItem(STORAGE_KEY)

    );

    return Array.isArray(data)

      ? data

      : [];

  }

  catch(error){

    return [];

  }

}


function saveRecords(records){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(records)

  );

}



/* =========================
   顯示畫面
========================= */

function render(){


  document.getElementById(

    'monthTitle'

  ).textContent =

    `${currentMonth.getFullYear()} 年 ${currentMonth.getMonth()+1} 月`;


  const records = getRecords()

    .filter(

      record => record.date.startsWith(monthKey())

    );


  /* 收入 */

  const income = records

    .filter(

      record => record.type === 'income'

    )

    .reduce(

      (total,record) =>

        total + Number(record.amount),

      0

    );


  /* 支出 */

  const expense = records

    .filter(

      record => record.type === 'expense'

    )

    .reduce(

      (total,record) =>

        total + Number(record.amount),

      0

    );


  document.getElementById(

    'incomeTotal'

  ).textContent = formatMoney(income);


  document.getElementById(

    'expenseTotal'

  ).textContent = formatMoney(expense);


  document.getElementById(

    'balanceTotal'

  ).textContent = formatMoney(

    income - expense

  );


  renderRecords(records);

  renderCategoryStats(records);

}



/* =========================
   顯示紀錄
========================= */

function renderRecords(records){


  recordsBody.innerHTML = '';


  if(records.length === 0){


    recordsBody.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty">

          這個月還沒有記帳紀錄

        </td>

      </tr>

    `;

    return;

  }


  const sortedRecords = [...records]

    .sort(

      (a,b) => {

        const timeA =

          `${a.date} ${a.time || '00:00'}`;

        const timeB =

          `${b.date} ${b.time || '00:00'}`;

        return timeB.localeCompare(timeA);

      }

    );


  sortedRecords.forEach(record => {


    const tr = document.createElement('tr');


    tr.innerHTML = `

      <td>

        ${escapeHtml(record.date)}

        <div class="time-text">

          ${escapeHtml(record.time || '')}

        </div>

      </td>


      <td>

        <span

          class="badge ${record.type === 'income' ? 'in' : 'out'}">

          ${record.type === 'income' ? '收入' : '支出'}

        </span>

      </td>


      <td>

        ${escapeHtml(record.item)}

      </td>


      <td>

        ${escapeHtml(record.category)}

      </td>


      <td

        class="${record.type === 'income' ? 'money-in' : 'money-out'}">

        ${record.type === 'income' ? '+' : '-'}

        ${formatMoney(record.amount)}

      </td>


      <td>

        ${escapeHtml(record.note)}

      </td>


      <td>

        <div class="row-actions">

          <button

            class="small-btn edit-btn"

            type="button"

            data-id="${escapeHtml(record.id)}">

            編輯

          </button>


          <button

            class="small-btn delete-btn"

            type="button"

            data-id="${escapeHtml(record.id)}">

            刪除

          </button>

        </div>

      </td>

    `;


    recordsBody.appendChild(tr);


  });


}



/* =========================
   分類統計
========================= */

function renderCategoryStats(records){


  const stats = document.getElementById(

    'categoryStats'

  );


  stats.innerHTML = '';


  const expenses = records.filter(

    record => record.type === 'expense'

  );


  const groups = {};


  expenses.forEach(record => {


    const category = record.category;


    groups[category] =

      (groups[category] || 0)

      +

      Number(record.amount);


  });


  const entries = Object.entries(groups)

    .sort(

      (a,b) => b[1] - a[1]

    );


  if(entries.length === 0){


    stats.innerHTML = `

      <div class="empty">

        本月還沒有支出資料

      </div>

    `;


    return;

  }


  const max = Math.max(

    ...entries.map(

      entry => entry[1]

    )

  );


  entries.forEach(

    ([category,value]) => {


      const row = document.createElement(

        'div'

      );


      row.className = 'stat-row';


      const percent =

        max === 0

          ? 0

          : (value / max) * 100;


      row.innerHTML = `

        <div>

          ${escapeHtml(category)}

        </div>


        <div class="bar">

          <div

            style="width:${Math.max(4,percent)}%">

          </div>

        </div>


        <strong>

          ${formatMoney(value)}

        </strong>

      `;


      stats.appendChild(row);


    }

  );


}



/* =========================
   新增紀錄
========================= */

recordForm.addEventListener(

  'submit',

  function(event){


    event.preventDefault();


    const records = getRecords();


    const date = dateInput.value;

    const type = typeInput.value;

    const item = itemInput.value.trim();

    const amount = Number(

      amountInput.value

    );

    const category = categoryInput.value;

    const note = noteInput.value.trim();


    if(!date){

      alert('請選擇日期');

      return;

    }


    if(!item){

      alert('請輸入項目名稱');

      itemInput.focus();

      return;

    }


    if(!Number.isFinite(amount) || amount <= 0){

      alert('請輸入正確金額');

      amountInput.focus();

      return;

    }


    /* 找舊資料 */

    const oldRecord = editingId

      ? records.find(

          record => String(record.id) === String(editingId)

        )

      : null;


    const data = {


      id:

        editingId

          ? editingId

          : String(Date.now()),


      date:date,


      /* 新增時記錄現在時間
         編輯時保留原本時間 */

      time:

        oldRecord

          ? (

              oldRecord.time

              ||

              getCurrentTime()

            )

          : getCurrentTime(),


      type:type,


      item:item,


      amount:amount,


      category:category,


      note:note


    };


    /* 編輯 */

    if(editingId){


      const index = records.findIndex(

        record =>

          String(record.id)

          ===

          String(editingId)

      );


      if(index !== -1){

        records[index] = data;

      }


    }


    /* 新增 */

    else{


      records.push(data);


    }


    saveRecords(records);


    /* 切換到資料月份 */

    currentMonth = new Date(

      `${data.date}T00:00:00`

    );


    currentMonth.setDate(1);


    resetForm();


    render();


  }

);



/* =========================
   編輯 / 刪除按鈕事件
========================= */

recordsBody.addEventListener(

  'click',

  function(event){


    const editButton =

      event.target.closest(

        '.edit-btn'

      );


    const deleteButton =

      event.target.closest(

        '.delete-btn'

      );


    /* 編輯 */

    if(editButton){


      const id =

        editButton.dataset.id;


      editRecord(id);


      return;


    }


    /* 刪除 */

    if(deleteButton){


      const id =

        deleteButton.dataset.id;


      deleteRecord(id);


      return;


    }


  }

);



/* =========================
   編輯紀錄
========================= */

function editRecord(id){


  const records = getRecords();


  const record = records.find(

    item =>

      String(item.id)

      ===

      String(id)

  );


  if(!record){

    alert('找不到這筆紀錄');

    return;

  }


  editingId = record.id;


  dateInput.value = record.date || getTodayDate();

  typeInput.value = record.type || 'expense';

  itemInput.value = record.item || '';

  amountInput.value = record.amount || '';

  categoryInput.value = record.category || '其他';

  noteInput.value = record.note || '';


  formTitle.textContent = '編輯記帳';

  submitBtn.textContent = '儲存修改';


  /* 手機版捲到表單 */

  const formCard = recordForm.closest('.card');


  if(formCard){

    formCard.scrollIntoView({

      behavior:'smooth',

      block:'start'

    });

  }


}



/* =========================
   刪除紀錄
========================= */

function deleteRecord(id){


  if(

    !confirm(

      '確定要刪除這筆紀錄嗎？'

    )

  ){

    return;

  }


  let records = getRecords();


  records = records.filter(

    record =>

      String(record.id)

      !==

      String(id)

  );


  saveRecords(records);


  if(

    editingId

    &&

    String(editingId)

    ===

    String(id)

  ){

    resetForm();

  }


  render();


}



/* =========================
   取消 / 重設
========================= */

cancelBtn.addEventListener(

  'click',

  function(){

    resetForm();

  }

);


function resetForm(){


  editingId = null;


  recordForm.reset();


  dateInput.value = getTodayDate();


  typeInput.value = 'expense';


  formTitle.textContent = '新增記帳';


  submitBtn.textContent = '新增紀錄';


}



/* =========================
   月份切換
========================= */

function changeMonth(delta){


  currentMonth.setMonth(

    currentMonth.getMonth() + delta

  );


  render();


}


document

  .getElementById('prevMonth')

  .addEventListener(

    'click',

    function(){

      changeMonth(-1);

    }

  );


document

  .getElementById('nextMonth')

  .addEventListener(

    'click',

    function(){

      changeMonth(1);

    }

  );



/* =========================
   網頁開啟
========================= */


/* 自動設定目前月份 */

currentMonth = new Date();

currentMonth.setDate(1);


/* 日期自動設定今天 */

resetForm();


/* 顯示資料 */

render();


</script>

</body>
</html>
